name: LidarScanner
options:
  bundleIdPrefix: com.lidarscanner
  deploymentTarget:
    iOS: "17.0"
targets:
  LidarScanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources: []
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSCameraUsageDescription: "Cette app utilise la caméra et le scanner LiDAR pour afficher le nuage de points 3D en temps réel."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarscanner.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: LidarScanner
        ENABLE_BITCODE: NO
